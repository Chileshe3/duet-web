<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duet — Web Test Client</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf2f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .chat-card {
  background: #fff;
  border-radius: 16px;
  width: 340px;
  height: 480px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  overflow: hidden;
}
.chat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid #f0e6ea;
}
.icon-btn { flex: none; width: 32px; background: transparent; color: #333; }
.chat-title { font-weight: 600; font-size: 14px; }
.chat-status { font-size: 12px; color: #888; display: flex; align-items: center; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; display: inline-block; }
.messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 75%; padding: 8px 12px; border-radius: 16px; font-size: 14px; }
.bubble.mine { align-self: flex-end; background: #d1477a; color: #fff; border-bottom-right-radius: 4px; }
.bubble.theirs { align-self: flex-start; background: #f0e6ea; color: #333; border-bottom-left-radius: 4px; }
.bubble-time { font-size: 10px; opacity: 0.7; margin-top: 2px; text-align: right; }
.chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #f0e6ea; align-items: center; }
.chat-input-row input { flex: 1; margin: 0; }
.chat-input-row button { flex: none; width: auto; padding: 10px 16px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 340px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 12px; color: #d1477a; }
  p { font-size: 14px; color: #444; line-height: 1.4; }
  .hint { color: #888; }
  .error { color: #c0392b; min-height: 18px; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .google-btn {
    width: 100%;
    background: #fff;
    color: #333;
    border: 1px solid #ddd;
    font-weight: 500;
  }
  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: #999;
    font-size: 12px;
    margin: 14px 0 4px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid #eee;
  }
  .divider span { padding: 0 10px; }
  button {
    flex: 1;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #d1477a;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  .bubble-media {
    display: block;
    max-width: 100%;
    max-height: 220px;
    border-radius: 12px;
    object-fit: cover;
  }
  .bubble-caption {
    margin-top: 4px;
    font-size: 13px;
  }
  .upload-status {
    padding: 6px 14px;
    font-size: 12px;
    color: #888;
  }
  .bubble-download {
    display: inline-block;
    margin-top: 4px;
    font-size: 13px;
    text-decoration: none;
    color: inherit;
    opacity: 0.85;
  }
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .lightbox-image {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
  }
  .lightbox-actions {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 10px;
  }
  .lightbox-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
  }
  #attachBtn {
    flex: none;
    width: 36px;
    background: transparent;
    color: #333;
    font-size: 16px;
    padding: 0;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button#back, button#signout, button#later {
    background: #eee;
    color: #333;
  }

  /* ---- Voice notes ---- */
  .mic-btn {
    width: 36px;
    background: transparent;
    color: #333;
    font-size: 16px;
    padding: 0;
    touch-action: none;
    user-select: none;
  }
  .mic-btn:active { color: #d1477a; }

  .recording-row { align-items: center; }
  .recording-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #333;
  }
  .rec-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #e53935;
    animation: rec-pulse 1s infinite;
  }
  @keyframes rec-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .recording-hint {
    margin-left: auto;
    font-size: 12px;
    color: #888;
  }

  .voice-note {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 150px;
  }
  .voice-note-toggle {
    flex: none;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    color: inherit;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bubble.theirs .voice-note-toggle { background: rgba(0,0,0,0.08); }
  .voice-note-body { flex: 1; min-width: 0; }
  .voice-note-progress {
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.35);
    overflow: hidden;
  }
  .bubble.theirs .voice-note-progress { background: rgba(0,0,0,0.15); }
  .voice-note-progress-fill {
    height: 100%;
    background: currentColor;
  }
  .voice-note-time {
    margin-top: 3px;
    font-size: 11px;
    opacity: 0.85;
  }

  /* ---- Call overlay ---- */
  #callOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: #1b1024;
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
    padding: 32px;
  }
  .call-avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a5ae0, #b165e8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  .call-name { font-size: 20px; font-weight: 600; }
  .call-subtitle { font-size: 14px; color: rgba(255,255,255,0.7); }
  .call-actions { display: flex; gap: 24px; margin-top: 12px; }
  .call-btn {
    flex: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 22px;
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .call-btn-end { background: #e53935; transform: rotate(135deg); }
  .call-btn-accept { background: #43a047; }
  .call-btn-active { background: #fff; color: #000; }

  /* ---- Thinking of You ---- */
  .nudge-fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(209,71,122,0.4);
    z-index: 1500;
  }
  .nudge-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 280px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    padding: 14px;
    z-index: 1500;
  }
  .nudge-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 14px;
    color: #d1477a;
    margin-bottom: 10px;
  }
  .nudge-close {
    flex: none;
    width: 24px;
    height: 24px;
    padding: 0;
    background: transparent;
    color: #888;
    font-size: 16px;
  }
  .nudge-presets {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 160px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .nudge-preset {
    background: #fdf2f6;
    color: #333;
    text-align: left;
    font-size: 12px;
    padding: 8px 10px;
  }
  .nudge-recent {
    border-top: 1px solid #f0e6ea;
    padding-top: 8px;
    max-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .nudge-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #444;
  }
  .nudge-who { color: #999; }
  .nudge-toast {
    position: fixed;
    bottom: 82px;
    right: 20px;
    max-width: 240px;
    background: #333;
    color: #fff;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 1600;
  }

  /* ---- Games (This or That) ---- */
  .game-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1800;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
  }
    .game-prompt { font-size: 14px; font-weight: 500; color: #333; margin: 10px 0; }
  .game-note { font-size: 12px; color: #888; margin: 6px 0; }
  .game-card {
    background: #fff;
    border-radius: 16px;
    width: 320px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid #f0e6ea;
    font-weight: 600;
    color: #d1477a;
  }
  .game-body {
    padding: 20px;
    text-align: center;
  }
  .game-body h2 { font-size: 17px; margin: 0 0 8px; color: #333; }
  .game-round-label { font-size: 12px; color: #888; margin-bottom: 14px; }
  .game-option {
    width: 100%;
    padding: 16px;
    margin: 6px 0;
    border-radius: 12px;
    background: #fdf2f6;
    color: #333;
    font-size: 14px;
    font-weight: 500;
  }
  .game-option.selected { background: #d1477a; color: #fff; }
  .game-or { font-size: 12px; color: #999; margin: 4px 0; }
  .game-reveal { margin-top: 16px; min-height: 20px; }
  .game-result { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
  .game-fab {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(209,71,122,0.4);
    z-index: 1500;
    
  }
    .game-fab-dare { bottom: 84px; }
</style>
</head>
<body>
  <div id="app"><div class="card"><p>Contempleting…</p></div></div>
  <div id="callOverlay"></div>
  <div id="nudgeOverlay"></div>
   <div id="gameFabContainer"></div>
  <div id="gameOverlay" class="game-overlay"></div>
  <div id="truthOrDareFabContainer"></div>
  <div id="truthOrDareOverlay" class="game-overlay"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
