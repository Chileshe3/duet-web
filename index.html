<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duet — Web Test Client</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf2f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .chat-card {
  background: #fff;
  border-radius: 16px;
  width: 340px;
  height: 480px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  overflow: hidden;
}
.chat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid #f0e6ea;
}
.icon-btn { flex: none; width: 32px; background: transparent; color: #333; }
.chat-title { font-weight: 600; font-size: 14px; }
.chat-status { font-size: 12px; color: #888; display: flex; align-items: center; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; display: inline-block; }
.messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 75%; padding: 8px 12px; border-radius: 16px; font-size: 14px; }
.bubble.mine { align-self: flex-end; background: #d1477a; color: #fff; border-bottom-right-radius: 4px; }
.bubble.theirs { align-self: flex-start; background: #f0e6ea; color: #333; border-bottom-left-radius: 4px; }
.bubble-time { font-size: 10px; opacity: 0.7; margin-top: 2px; text-align: right; }
.chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #f0e6ea; }
.chat-input-row input { flex: 1; margin: 0; }
.chat-input-row button { flex: none; width: auto; padding: 10px 16px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 340px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 12px; color: #d1477a; }
  p { font-size: 14px; color: #444; line-height: 1.4; }
  .hint { color: #888; }
  .error { color: #c0392b; min-height: 18px; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button {
    flex: 1;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #d1477a;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button#back, button#signout, button#later {
    background: #eee;
    color: #333;
  }
</style>
</head>
<body>
  <div id="app"><div class="card"><p>Loading…</p></div></div>
  <script type="module" src="app.js"></script>
  
</body>
</html>
