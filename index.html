<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duet — Web Test Client</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf2f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 340px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 12px; color: #d1477a; }
  p { font-size: 14px; color: #444; line-height: 1.4; }
  .hint { color: #888; }
  .error { color: #c0392b; min-height: 18px; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button {
    flex: 1;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #d1477a;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button#back, button#signout, button#later {
    background: #eee;
    color: #333;
  }
</style>
</head>
<body>
  <div id="app"><div class="card"><p>Loading…</p></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
